<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET & POST REQUEST</title>
</head>
<body>

    //GET request is basically to get some response
    //data send in every querry strings
   <h3>GET request form</h3>
  <form method="get" action="/register">
        <input placeholder="enter username" name="user" type="text" />
         <input placeholder="enter password" name="password" type="password" />
         <button>submit</button>
    </form>
    <hr>
    //POST request is basically used to POST something( for a create/write/update)
    //data sent via request body(any type of data)
    <h3>POST request form</h3>
      <form method="post" action="/register">
        <input placeholder="enter username" name="user" type="text" />
         <input placeholder="enter password" name="password" type="password" />
         <button>submit</button>
    </form>
    </body>
</html>
